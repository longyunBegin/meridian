[package]
name = "meridian"
version = "0.1.4"
description = "Meridian desktop app"
authors = ["longyunBegin"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
# E2E 测试专用：cargo build --features webdriver 时在应用内嵌入 W3C WebDriver 服务；
# 默认构建（及所有 release 构建）绝不包含
webdriver = ["tauri-plugin-wdio-webdriver"]
