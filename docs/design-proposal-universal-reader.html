<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>读者页 · 通用方案草图</title>
<style>
  :root {
    --bg: #f5f5f7; --surface: #fff; --hairline: rgba(0,0,0,.1); --hairline-soft: rgba(0,0,0,.06); --hover: rgba(0,0,0,.05);
    --text-1: #1d1d1f; --text-2: #55555a; --text-3: #8e8e93; --accent: #0071e3;
    --orange: #a35800; --red: #c4161c; --green: #1a7f37;
    --t-caption: 12px; --t-footnote: 13px; --t-body: 14px; --t-title: 17px; --t-large: 26px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text-1); font: var(--t-body)/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  button { font: inherit; color: inherit; }
  .stage-bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; padding: 10px 24px; background: rgba(245,245,247,.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--hairline); }
  .stage-bar span { color: var(--text-3); font-size: var(--t-caption); margin-right: 4px; }
  .stage-btn { padding: 4px 14px; border: 1px solid var(--hairline); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: var(--t-footnote); }
  .stage-btn.is-active { background: var(--text-1); color: #fff; border-color: var(--text-1); }
  .stage-note { margin-left: auto; color: var(--text-3); font-size: var(--t-caption); }
  main { max-width: 880px; margin: 0 auto; padding: 32px 24px 80px; }
  section { margin: 0 0 40px; }
  h2 { margin: 0 0 12px; font-size: var(--t-title); }
  .kicker { margin: 0 0 4px; color: var(--text-3); font-size: var(--t-caption); letter-spacing: .06em; }
  h1 { margin: 0 0 12px; font-size: var(--t-large); line-height: 1.3; }
  .maturity { margin: 0 0 14px; padding: 12px 16px; border-left: 3px solid var(--accent); border-radius: 4px; background: var(--surface); font-size: var(--t-body); }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 24px; margin: 0; padding: 0; list-style: none; }
  .facts li { display: grid; }
  .facts b { font-weight: 600; font-size: var(--t-footnote); font-variant-numeric: tabular-nums; }
  .facts span { color: var(--text-3); font-size: var(--t-caption); }
  .hint { margin: 0 0 12px; color: var(--text-3); font-size: var(--t-caption); }
  .empty { padding: 14px 16px; border: 1px dashed var(--hairline); border-radius: 10px; color: var(--text-2); font-size: var(--t-footnote); }
  .empty b { color: var(--text-1); }
  .line { margin: 0 0 14px; padding: 14px 16px; border: 1px solid var(--hairline); border-radius: 12px; background: var(--surface); }
  .line-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin: 0 0 8px; color: var(--text-3); font-size: var(--t-caption); }
  .line-head b { color: var(--text-1); font-size: var(--t-footnote); }
  .tree, .tree ul { list-style: none; margin: 0; padding: 0; }
  .tree ul { margin-left: 10px; padding-left: 14px; border-left: 1px solid var(--hairline); }
  .row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; padding: 5px 0; }
  .row.is-root .t { font-size: var(--t-body); font-weight: 600; }
  .toggle { width: 16px; flex: none; border: 0; background: none; padding: 0; color: var(--text-3); cursor: pointer; font-size: 10px; }
  .toggle.is-leaf { visibility: hidden; }
  .rel { flex: none; padding: 0 7px; border-radius: 999px; background: var(--hover); color: var(--text-2); font-size: var(--t-caption); }
  .rel.is-contra { color: var(--red); }
  .t { flex: 1 1 260px; min-width: 0; font-size: var(--t-footnote); cursor: pointer; }
  .t:hover { color: var(--accent); }
  .type { color: var(--text-3); font-size: var(--t-caption); }
  .meta { color: var(--text-3); font-size: var(--t-caption); font-variant-numeric: tabular-nums; }
  .pending { color: var(--orange); font-size: var(--t-caption); }
  .seeabove { color: var(--text-3); font-size: var(--t-caption); font-style: italic; }
  .state { flex-basis: 100%; margin-left: 24px; color: var(--text-2); font-size: var(--t-caption); }
  .watch-item { display: grid; grid-template-columns: 200px 1fr; gap: 2px 16px; padding: 10px 0; border-top: 1px solid var(--hairline-soft); }
  .watch-item .when { grid-row: span 2; color: var(--text-2); font-size: var(--t-footnote); }
  .watch-item.is-soon .when { color: var(--orange); font-weight: 600; }
  .watch-item .wt { font-weight: 600; }
  .watch-item .fx { color: var(--text-2); font-size: var(--t-footnote); }
  .group { margin: 0 0 18px; }
  .group-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; }
  .group-head h3 { margin: 0; font-size: var(--t-body); }
  .group-head span { color: var(--text-3); font-size: var(--t-caption); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
  .chip { padding: 1px 10px; border: 1px solid var(--hairline); border-radius: 999px; background: var(--surface); color: var(--text-2); font-size: var(--t-caption); cursor: pointer; }
  .chip.is-on { border-color: var(--accent); color: var(--accent); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; border-top: 1px solid var(--hairline-soft); }
  .list li.is-bare .t { color: var(--text-3); }
  .more { margin-top: 4px; border: 0; background: none; padding: 0; color: var(--accent); font-size: var(--t-caption); cursor: pointer; }
  .gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }

  .gloss b { display: block; font-size: var(--t-footnote); }

const TYPE = {
  segment: '维度', hypothesis: '假设', viewpoint: '观点', observation: '观察', axiom: '公理',
  concept: '概念', object: '对象', event: '事件',
}
const REL = { supports: '支持', contradicts: '反驳', derives: '推出', influences: '影响', 'depends-on': '是前提', 'belongs-to': '组成' }
const GROUPS = [
  { label: '判断', hint: '有人认为——假设与观点', types: ['hypothesis', 'viewpoint'] },
  { label: '事实', hint: '看到了什么——观察，有证据、证据新的在前', types: ['observation'] },
  { label: '前提', hint: '默认成立的——公理', types: ['axiom'] },
  { label: '维度', hint: '没连进主线的维度', types: ['segment'] },
]
const ENTITY = ['concept', 'object', 'event']

/* ---------------- 通用模型：只用节点类型、关系、证据 ---------------- */
function model(stage) {
  const nodes = stage.nodes
  const byId = new Map(nodes.map((n) => [n.id, n]))
  const claims = nodes.filter((n) => !ENTITY.includes(n.type))
  const edges = stage.edges.filter((e) => REL[e.rel])
  /* 统一成「下游 ← 上游」：parent = 被支持/被推出的那条 */
  const up = new Map(nodes.map((n) => [n.id, []]))
  const down = new Map(nodes.map((n) => [n.id, []]))
  for (const e of edges) {
    const [child, parent] = e.rel === 'depends-on' ? [e.to, e.from] : [e.from, e.to]
    up.get(parent).push({ id: child, rel: e.rel, pending: !!e.pending })
    down.get(child).push(parent)
  }
  /* 连通的一团 = 一条主线 */
  const seen = new Set()
  const lines = []
  for (const n of claims) {
    if (seen.has(n.id) || (!up.get(n.id).length && !down.get(n.id).length)) continue
    const members = []
    const stack = [n.id]
    seen.add(n.id)
    while (stack.length) {
      const id = stack.pop()
      members.push(id)
      for (const x of [...up.get(id).map((r) => r.id), ...down.get(id)]) if (!seen.has(x)) { seen.add(x); stack.push(x) }
    }
    const reach = (id, acc = new Set()) => { for (const r of up.get(id)) if (!acc.has(r.id)) { acc.add(r.id); reach(r.id, acc) } return acc.size }
    const sinks = members.filter((id) => !down.get(id).length).sort((a, b) => reach(b) - reach(a))
    lines.push({ members, sinks, reach })
  }
  lines.sort((a, b) => b.members.length - a.members.length)
  const inLine = new Set(lines.flatMap((l) => l.members))
  const loose = claims.filter((n) => !inLine.has(n.id))
  const withEv = claims.filter((n) => n.ev > 0).length
  const lastDay = nodes.map((n) => n.day).filter(Boolean).sort().at(-1) || null
  return { byId, up, claims, lines, loose, withEv, lastDay, entities: nodes.filter((n) => ENTITY.includes(n.type)) }
}

/* ---------------- 渲染 ---------------- */
const el = (tag, cls, ...kids) => { const e = document.createElement(tag); if (cls) e.className = cls; for (const k of kids.flat()) if (k != null) e.append(k); return e }
const meta = (n) => (n.ev ? `证据 ${n.ev}${n.day ? ` · 最近 ${n.day.slice(5)}` : ''}` : '无证据')

function render(index) {
  const stage = STAGES[index]
  const m = model(stage)
  const page = document.getElementById('page')
  page.replaceChildren()

  /* ① 概览 */
  const covered = m.claims.length - m.loose.length
  const sentence = !m.claims.length ? '还没有任何陈述。'
    : `${m.claims.length} 条陈述，${m.withEv} 条有证据；`
      + (m.lines.length ? `${covered} 条连成 ${m.lines.length} 条主线，其余 ${m.loose.length} 条还是散点。` : '彼此之间还没有关系，都是散点。')
  page.append(el('section', null,
    el('p', 'kicker', '主题'),
    el('h1', null, stage.name),
    el('p', 'maturity', sentence),
    el('ul', 'facts',
      el('li', null, el('b', null, String(m.claims.length)), el('span', null, '陈述')),
      el('li', null, el('b', null, String(m.withEv)), el('span', null, '有证据')),
      el('li', null, el('b', null, String(m.lines.length)), el('span', null, '主线')),
      m.entities.length ? el('li', null, el('b', null, String(m.entities.length)), el('span', null, '概念 / 对象')) : null,
      el('li', null, el('b', null, m.lastDay || '—'), el('span', null, '最近一条证据')))))

  /* ② 主线 */
  const lineSec = el('section', null, el('h2', null, '主线 · 谁支撑谁'))
  if (!m.lines.length) {
    lineSec.append(el('div', 'empty', el('b', null, '还没有陈述之间的关系。'), ' 在建设者里给两条陈述连上「支持 / 推出 / 影响」，这里就会出现主线。'))
  } else {
    lineSec.append(el('p', 'hint', '每条主线从它的汇点（其它陈述最终指向的那条）展开；缩进一级 = 上游一步。同一条陈述只在离汇点最近的那一处完整展开，别处标明它在哪里展开。'))
    m.lines.forEach((line, i) => {
      /* 每条陈述的"家" = 离汇点最近的那一处（广度优先，并列按账本顺序）；只在家里完整展开，别处标「见上文」。 */
      const home = new Map(line.sinks.map((id) => [id, '#root']))
      const queue = [...line.sinks]
      while (queue.length) {
        const id = queue.shift()
        for (const r of m.up.get(id)) if (!home.has(r.id)) { home.set(r.id, id); queue.push(r.id) }
      }
      const pending = line.members.reduce((s, id) => s + m.up.get(id).filter((r) => r.pending).length, 0)
      const node = (id, rel, isPending, depth, parent = '#root') => {
        const n = m.byId.get(id)
        const kids = m.up.get(id)
        const repeat = home.get(id) !== parent
        const li = el('li')
        const sub = !repeat && kids.length ? el('ul', null, kids.map((r) => node(r.id, r.rel, r.pending, depth + 1, id))) : null
        const toggle = el('button', `toggle${sub ? '' : ' is-leaf'}`, sub ? (depth >= 2 ? '▸' : '▾') : '')
        if (sub && depth >= 2) sub.hidden = true
        toggle.onclick = () => { sub.hidden = !sub.hidden; toggle.textContent = sub.hidden ? '▸' : '▾' }
        li.append(el('div', `row${depth === 0 ? ' is-root' : ''}`,
          toggle,
          rel ? el('span', `rel${rel === 'contradicts' ? ' is-contra' : ''}`, REL[rel]) : null,
          el('span', 't', n.title),
          el('span', 'type', TYPE[n.type]),
          repeat ? el('span', 'seeabove', `在「${m.byId.get(home.get(id))?.title ?? '主线顶端'}」下展开`) : el('span', 'meta', meta(n)),
          isPending ? el('span', 'pending', '待复核') : null,
          !repeat && n.state ? el('span', 'state', n.state) : null))
        if (sub) li.append(sub)
        return li
      }
      const root = line.sinks[0]
      const extra = line.sinks.length > 1 ? `，另有 ${line.sinks.length - 1} 个汇点` : ''
      lineSec.append(el('div', 'line',
        el('div', 'line-head', el('b', null, `主线 ${i + 1}`), el('span', null, `${line.members.length} 条陈述 · 汇向「${m.byId.get(root).title}」${extra}`), pending ? el('span', 'pending', `${pending} 条关系待复核`) : null),
        el('ul', 'tree', line.sinks.map((id) => node(id, null, false, 0)))))
    })
  }
  page.append(lineSec)

  /* ③ 接下来看什么 */
  if (stage.watch.length || stage.indicators) {
    page.append(el('section', null, el('h2', null, '接下来看什么'),
      stage.watch.map((w) => el('div', `watch-item${w.soon ? ' is-soon' : ''}`, el('span', 'when', w.when), el('span', 'wt', w.title), el('span', 'fx', `推翻条件：${w.fx}`))),
      stage.indicators ? el('p', 'hint', `▸ 跟踪指标 ${stage.indicators} 个（按频率分组，默认折叠）`) : null))
  }

  /* ④ 散点：按认知角色分组 */
  const looseSec = el('section', null, el('h2', null, m.lines.length ? `还没连进主线的陈述 · ${m.loose.length}` : `全部陈述 · ${m.loose.length}`))
  if (m.lines.length && m.loose.length) looseSec.append(el('p', 'hint', '账本里没有它们和主线之间的关系，读者页不按标题去猜归属。去建设者连上关系，它们就会进入主线。'))
  for (const g of GROUPS) {
    const rows = m.loose.filter((n) => g.types.includes(n.type)).sort((a, b) => (b.ev > 0) - (a.ev > 0) || (b.day || '').localeCompare(a.day || ''))
    if (!rows.length) continue
    const box = el('div', 'group', el('div', 'group-head', el('h3', null, `${g.label} · ${rows.length}`), el('span', null, g.hint)))
    const tags = [...new Set(rows.flatMap((n) => n.tags || []))]
    let active = null
    const list = el('ul', 'list')
    let expanded = false
    const paint = () => {
      const filtered = rows.filter((n) => !active || (n.tags || []).includes(active))
      const visible = expanded ? filtered : filtered.slice(0, 6)
      list.replaceChildren(...visible.map((n) => el('li', n.ev ? '' : 'is-bare', el('span', 't', n.title), el('span', 'type', TYPE[n.type]), el('span', 'meta', meta(n)))))
      more.hidden = filtered.length <= 6
      more.textContent = expanded ? '收起' : `展开全部 ${filtered.length} 条`
    }
    const more = el('button', 'more')
    more.onclick = () => { expanded = !expanded; paint() }
    if (tags.length > 1) {
      box.append(el('div', 'chips', tags.slice(0, 10).map((tag) => {
        const chip = el('button', 'chip', tag)
        chip.onclick = () => { active = active === tag ? null : tag; box.querySelectorAll('.chip').forEach((c) => c.classList.toggle('is-on', c.textContent === active)); paint() }
        return chip
      })))
    }
    box.append(list, more)
    paint()
    looseSec.append(box)
  }
  page.append(looseSec)

  /* ⑤ 涉及什么：概念 / 对象 / 事件 */
  const glossSec = el('section', null, el('h2', null, '涉及什么 · 概念与对象'))
  if (m.entities.length) {
    glossSec.append(el('div', 'gloss', m.entities.map((n) => el('div', null, el('b', null, n.title, el('em', null, TYPE[n.type])), el('span', null, n.detail || '（还没有写说明）')))))
  } else {
    glossSec.append(el('div', 'empty', el('b', null, '还没有概念或对象节点。'), ' 陌生读者最需要的是词汇表——在建设者里新建「概念 / 对象 / 事件」并写一句说明，这里就会出现。'))
  }
  page.append(glossSec)

  if (index === 2) {
    page.append(el('p', 'annot', '注：③ 的主线、维度现状、见分晓、证据日期、条数（92 条陈述 / 12 条在主线 / 80 条散点）都按真实账本；只有 55 个没有证据的指标观察节点用占位标题代替。点任何一条都会打开右侧抽屉（沿用现有抽屉，草图里不展示）。'))
  }

  document.querySelectorAll('.stage-btn').forEach((b) => b.classList.toggle('is-active', Number(b.dataset.stage) === index))
}

document.querySelectorAll('.stage-btn').forEach((b) => b.addEventListener('click', () => render(Number(b.dataset.stage))))
render(0)
</script>
</body>
</html>
