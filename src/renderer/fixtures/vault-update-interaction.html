<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meridian vault archive / cold and update UI fixture</title>
  <style>
    html,body{min-height:100%;margin:0;background:#f5f5f7;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202124}
    body{padding:20px;box-sizing:border-box}
    #fixture-root{max-width:1100px;margin:0 auto 22px}
    #fixture-report{max-width:1100px;margin:20px auto;padding:12px;background:#111;color:#d7f8df;border:1px solid #3a6;border-radius:10px;font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap}
    #fixture-report.fail{color:#ffd4d4;border-color:#d44}
  </style>
</head>
<body>
  <main id="fixture-root">
    <div id="empty-fixture"></div>
    <div id="populated-fixture"></div>
    <div id="corrupt-fixture"></div>
    <div id="unparsed-fixture"></div>
    <div id="cold-fixture"></div>
    <div id="cold-thaw-fixture"></div>
  </main>
  <pre id="fixture-report">Fixture starting…</pre>
  <script type="module">
    import '../styles.css'

    const goodArchive = {
      themeId: 'good-theme',
      integrity: { ok: true, count: 2, lastValidSeq: 2 },
      nodes: [{
        id: 'archive-evidence-1',
        nodeType: 'evidence',
        kind: 'evidence',
        title: '合成归档证据：港口需求已变化',
        currentText: '港口吞吐同比下滑，现货报价承压。',
        archiveReason: '两份合成来源互相矛盾',
        archivedAt: '2026-09-30T00:00:00.000Z',
        sourceRef: 'fixture:good-evidence',
        sourceKind: 'shelved-proposal',
        sourceLabel: '合成来源 A',
        evidenceCount: 1,
        provenanceEventIds: ['archive-event-1'],
      }],
      edges: [],
    }
    const corruptArchive = {
      themeId: 'corrupt-theme',
      integrity: { ok: false, count: 2, lastValidSeq: 1, reason: 'synthetic hash mismatch' },
      nodes: [{
        id: 'archive-evidence-corrupt',
        nodeType: 'evidence',
        kind: 'evidence',
        title: '合成损坏账本：有效前缀归档',
        archiveReason: '仅为浏览器 fixture',
        archivedAt: '2026-09-29T00:00:00.000Z',
        sourceRef: 'fixture:corrupt',
        provenanceEventIds: ['valid-archive-event'],
      }],
      edges: [],
    }
    const fixtures = {
      'empty-theme': { archive: { integrity: { ok: true, count: 0, lastValidSeq: 0 }, nodes: [], edges: [] }, parked: { nodes: [] } },
      'good-theme': { archive: goodArchive, parked: { nodes: [] } },
      'corrupt-theme': { archive: corruptArchive, parked: { nodes: [] } },
      'unparsed-theme': { archive: { nodes: 'malformed nodes', edges: null, integrity: null }, parked: { nodes: [] } },
      'cold-theme': {
        archive: { integrity: { ok: true, count: 0, lastValidSeq: 0 }, nodes: [], edges: [] },
        parked: {
          themeId: 'cold-theme',
          nodes: [{
            id: 'parked-1',
            nodeType: 'evidence',
            title: '合成冷冻外部数据',
            currentText: '竞争对手在展会上放出未证实样品进度。',
            cold: true,
            sourceRef: 'fixture:parked-1',
            sourceLabel: '展会简报',
            parkReason: '弱信号暂存',
            parkedAt: '2026-10-01T12:00:00.000Z',
          }],
          edges: [],
        },
      },
    }
    const legacyColdNode = {
      id: 'legacy-cold-1',
      themeId: 'cold-theme',
      status: 'cold',
      kind: 'lemma',
      type: 'hypothesis',
      title: '合成历史冷库条目',
      confidence: 51,
    }
    let activeFixtureNodes = []
    let activeColdNodes = [...fixtures['cold-theme'].parked.nodes]
    let failNextUnpark = false
    let restoreCalls = 0
    let restoreRef = ''
    window.meridian = {
      // Keep app boot suspended so the fixture never invokes host APIs or loads local data.
      themes: () => new Promise(() => {}),
      settings: async () => ({}),
      async allNodes() { return activeFixtureNodes },
      async chainArchives(themeId) { return fixtures[themeId]?.archive },
      async chainParked(themeId) {
        if (themeId === 'cold-theme') return { ...fixtures[themeId].parked, nodes: activeColdNodes }
        return fixtures[themeId]?.parked || { themeId, nodes: [], edges: [] }
      },
      async chainProjection(themeId) {
        throw new Error(`projection must not be required for ${themeId}`)
      },
      async chainRestoreNode(_themeId, sourceRef) { restoreCalls++; restoreRef = sourceRef; return { ok: true } },
      async chainUnparkNode(_themeId, sourceRef) {
        if (failNextUnpark) {
          failNextUnpark = false
          throw new Error('synthetic unpark failure')
        }
        activeColdNodes = activeColdNodes.filter((node) => node.sourceRef !== sourceRef)
        return { ok: true }
      },
      async updateNode() { return { ok: true } },
      async restoreNode() { return { ok: true } },
    }

    const { state } = await import('../app.js')
    const { renderVault } = await import('../views/vault.js')
    const { presentUpdate } = await import('../lib/updater.js')
    const report = document.querySelector('#fixture-report')
    const results = []
    const check = (label, condition, detail = '') => {
      results.push({ label, passed: Boolean(condition), detail })
      if (!condition) report.classList.add('fail')
      report.textContent = results.map((r) => `${r.passed ? 'PASS' : 'FAIL'} ${r.label}${r.detail ? ` — ${r.detail}` : ''}`).join('\n')
    }
    const settled = () => new Promise((resolve) => setTimeout(resolve, 40))
    const themes = {
      empty: { id: 'empty-theme', name: '空主题（合成）' },
      good: { id: 'good-theme', name: '合成：城市港口需求' },
      corrupt: { id: 'corrupt-theme', name: '合成：损坏尾部' },
      unparsed: { id: 'unparsed-theme', name: '合成：未解析返回' },
      cold: { id: 'cold-theme', name: '合成：冷库主题' },
    }

    activeFixtureNodes = []
    state.themes = [themes.empty]
    await renderVault(document.querySelector('#empty-fixture'), 'archive')
    check('空归档仅显示一个清晰空态，不出现空筛选控件', !document.querySelector('#empty-fixture .event-archive-controls')
      && document.querySelector('#empty-fixture').textContent.includes('归档是空的'))

    activeFixtureNodes = []
    state.themes = [themes.good]
    await renderVault(document.querySelector('#populated-fixture'), 'archive')
    const populated = document.querySelector('#populated-fixture')
    check('合成归档证据、原因、日期可读', populated.textContent.includes('合成归档证据：港口需求已变化')
      && populated.textContent.includes('两份合成来源互相矛盾')
      && populated.textContent.includes('2026-09-30'))
    check('归档行使用条目列表与恢复入口', Boolean(populated.querySelector('.vault-entries .vault-row'))
      && Boolean(populated.querySelector('button.btn-primary')))
    const archiveView = populated.querySelector('.vault-view-btn')
    const themeBeforeArchiveView = state.themeId
    const viewBeforeArchiveView = state.view
    archiveView?.click()
    await settled()
    check('归档「查看」本页展开详情，不跳建设者', archiveView?.getAttribute('aria-expanded') === 'true'
      && archiveView?.textContent === '收起'
      && populated.querySelector('.vault-row.is-open .vault-detail:not([hidden])')?.textContent.includes('港口吞吐')
      && state.themeId === themeBeforeArchiveView
      && state.view === viewBeforeArchiveView)
    archiveView?.click()
    await settled()
    check('再次点击收起详情', archiveView?.getAttribute('aria-expanded') === 'false'
      && populated.querySelector('.vault-detail[hidden]'))

    const archiveSearch = populated.querySelector('.event-archive-search')
    archiveSearch.value = '港口需求'
    archiveSearch.dispatchEvent(new Event('input', { bubbles: true }))
    check('事件归档可按文字搜索且不截断标题', populated.querySelectorAll('.event-archive-row').length === 1
      && populated.querySelector('.event-archive-row').textContent.includes('港口需求已变化'))
    const archiveEvidenceFilter = [...populated.querySelectorAll('.tomb-filter')].find((button) => button.textContent === '证据')
    archiveEvidenceFilter?.click()
    check('事件归档类型筛选仍可用并同步 aria-pressed', archiveEvidenceFilter?.getAttribute('aria-pressed') === 'true'
      && populated.querySelector('.event-archive-row'))
    populated.querySelector('button.btn-primary')?.click()
    await settled()
    check('恢复仍追加到合成 sourceRef，不改写旧归档', restoreCalls === 1 && restoreRef === 'fixture:good-evidence')
    // 模块级搜索条件会带到下一次归档渲染；清掉以免污染损坏账本用例。
    const clearedSearch = populated.querySelector('.event-archive-search')
    if (clearedSearch) {
      clearedSearch.value = ''
      clearedSearch.dispatchEvent(new Event('input', { bubbles: true }))
    }

    activeFixtureNodes = []
    state.themes = [themes.corrupt]
    await renderVault(document.querySelector('#corrupt-fixture'), 'archive')
    const corrupt = document.querySelector('#corrupt-fixture')
    check('损坏账本显示有效前缀归档和完整性警告，且恢复禁用', corrupt.textContent.includes('校验失败')
      && corrupt.textContent.includes('合成损坏账本：有效前缀归档')
      && corrupt.querySelector('.event-archive-row .btn-primary')?.disabled === true)

    activeFixtureNodes = []
    state.themes = [themes.unparsed]
    let unparsedThrew = false
    try { await renderVault(document.querySelector('#unparsed-fixture'), 'archive') } catch { unparsedThrew = true }
    const unparsed = document.querySelector('#unparsed-fixture')
    check('未解析或形状损坏的数据不会令归档页崩溃，并明确报告无法读取', !unparsedThrew
      && unparsed.textContent.includes('归档返回不完整或无法解析'))

    activeFixtureNodes = [legacyColdNode]
    // 三个主题故意让 chainParked 抛错：页面应软失败，不出现「读取失败」红条。
    const originalParked = window.meridian.chainParked
    window.meridian.chainParked = async (themeId) => {
      if (themeId === 'cold-theme') return originalParked(themeId)
      throw new Error('synthetic parked failure')
    }
    state.themes = [themes.cold, { id: 'broken-theme', name: '坏主题' }, { id: 'broken-theme-2', name: '坏主题2' }, { id: 'broken-theme-3', name: '坏主题3' }]
    await renderVault(document.querySelector('#cold-fixture'), 'cold')
    const cold = document.querySelector('#cold-fixture')
    check('冷库展示冷冻与历史条目，不因个别主题失败刷红', cold.textContent.includes('合成冷冻外部数据')
      && cold.textContent.includes('合成历史冷库条目')
      && !cold.textContent.includes('读取失败'))
    check('冷库行排列为条目列表，操作区含查看与解冻', Boolean(cold.querySelector('.vault-entries .vault-row .vault-acts'))
      && [...cold.querySelectorAll('.vault-view-btn')].length >= 2
      && [...cold.querySelectorAll('.btn-primary')].some((button) => button.textContent === '解冻'))
    const coldView = cold.querySelector('.vault-view-btn')
    const themeBeforeColdView = state.themeId
    const viewBeforeColdView = state.view
    coldView?.click()
    await settled()
    check('冷库「查看」展开该条详情，不跳建设者', coldView?.textContent === '收起'
      && cold.querySelector('.vault-row.is-open .vault-detail:not([hidden])')?.textContent.includes('未证实样品')
      && state.themeId === themeBeforeColdView
      && state.view === viewBeforeColdView)

    const coldThaw = document.querySelector('#cold-thaw-fixture')
    const coldSource = fixtures['cold-theme'].parked.nodes[0]
    activeFixtureNodes = []
    state.themes = [themes.cold]
    activeColdNodes = [{ ...coldSource, id: 'thaw-one', title: '合成唯一冷库条目', currentText: '唯一条目内容', sourceRef: 'fixture:thaw-one' }]
    failNextUnpark = true
    await renderVault(coldThaw, 'cold')
    const singleUnpark = coldThaw.querySelector('.vault-row .btn-primary')
    singleUnpark?.click()
    await settled()
    check('单条冷库解冻失败时保留唯一条目并恢复可重试按钮', coldThaw.querySelectorAll('.vault-entries .vault-row').length === 1
      && singleUnpark?.disabled === false
      && coldThaw.querySelectorAll('.vault-page').length === 1)
    singleUnpark?.click()
    await settled()
    check('唯一条目解冻后列表清零且只显示一个空态（无旧行残留）', coldThaw.querySelectorAll('.vault-entries .vault-row').length === 0
      && coldThaw.querySelectorAll('.tomb-empty-state').length === 1
      && coldThaw.querySelectorAll('.vault-page').length === 1
      && coldThaw.textContent.includes('冷库是空的'))

    activeColdNodes = [
      { ...coldSource, id: 'thaw-many-1', title: '合成多条冷库：先解冻', currentText: '第一条内容', sourceRef: 'fixture:thaw-many-1' },
      { ...coldSource, id: 'thaw-many-2', title: '合成多条冷库：保留项', currentText: '保留项详情正文', sourceRef: 'fixture:thaw-many-2' },
    ]
    await renderVault(coldThaw, 'cold')
    coldThaw.querySelector('.vault-row .btn-primary')?.click()
    await settled()
    const remainingColdRow = coldThaw.querySelector('.vault-entries .vault-row')
    check('多条冷库解冻一条后仅保留另一条，标题和详情对应正确', coldThaw.querySelectorAll('.vault-entries .vault-row').length === 1
      && remainingColdRow?.textContent.includes('合成多条冷库：保留项')
      && !coldThaw.textContent.includes('合成多条冷库：先解冻'))
    remainingColdRow?.querySelector('.vault-view-btn')?.click()
    check('多条解冻后的剩余项详情没有串到已解冻条目', remainingColdRow?.querySelector('.vault-detail:not([hidden])')?.textContent.includes('保留项详情正文')
      && remainingColdRow?.querySelector('.vault-detail:not([hidden])')?.textContent.includes('fixture:thaw-many-2'))

    const originalAllNodes = window.meridian.allNodes
    window.meridian.allNodes = async () => { throw new Error('synthetic cold read failure') }
    activeColdNodes = []
    await renderVault(coldThaw, 'cold')
    for (let attempt = 0; attempt < 3; attempt++) {
      coldThaw.querySelector('.vault-page button')?.click()
      await settled()
    }
    check('连续错误重试不叠加页面或告警 DOM', coldThaw.querySelectorAll('.vault-page').length === 1
      && coldThaw.querySelectorAll('[role="alert"]').length === 1
      && coldThaw.querySelectorAll('.tomb-empty-state').length === 0)
    window.meridian.allNodes = originalAllNodes
    coldThaw.querySelector('.vault-page button')?.click()
    await settled()
    check('错误恢复后的重复渲染仅保留一个冷库页和一个空态', coldThaw.querySelectorAll('.vault-page').length === 1
      && coldThaw.querySelectorAll('.tomb-empty-state').length === 1
      && coldThaw.querySelectorAll('.vault-entries').length === 0)

    let downloadCalls = 0
    let installCalls = 0
    let closeCalls = 0
    let releaseDownload
    const syntheticUpdate = {
      version: '0.2.0-fixture', currentVersion: '0.1.9-fixture', date: '2026-10-01T00:00:00Z',
      body: '### 合成更新说明\n- 保留现有确认步骤\n- 不连接更新服务器',
      async download(onEvent) {
        downloadCalls++
        onEvent({ event: 'Started', data: { contentLength: 100 } })
        onEvent({ event: 'Progress', data: { chunkLength: 50 } })
        await new Promise((resolve) => { releaseDownload = resolve })
        onEvent({ event: 'Finished' })
      },
      async install() { installCalls++; throw new Error('synthetic install failure') },
      async close() { closeCalls++ },
    }
    const updateDialog = presentUpdate(syntheticUpdate)
    check('发现更新显示非模态卡片、关闭 X 和下载 CTA，不显示重启 CTA', updateDialog.getAttribute('aria-modal') === 'false'
      && updateDialog.dataset.updateState === 'available'
      && updateDialog.querySelector('.update-close[aria-label="关闭更新提示"]')
      && updateDialog.querySelector('.update-primary').textContent === '下载更新'
      && !updateDialog.textContent.includes('重新启动以更新'))
    check('更新卡片具有键盘可达主操作与发布说明', updateDialog.querySelector('.update-primary')?.type === 'button'
      && updateDialog.querySelector('.update-notes').textContent.includes('保留现有确认步骤'))
    updateDialog.querySelector('.update-primary').click()
    await settled()
    check('下载中只显示进度并锁住关闭/安装入口', updateDialog.dataset.updateState === 'downloading'
      && downloadCalls === 1 && installCalls === 0
      && updateDialog.querySelector('.update-close').disabled
      && updateDialog.querySelector('.update-progress-track').getAttribute('aria-valuenow') === '50')
    releaseDownload?.()
    await settled()
    check('下载完成仅进入 ready，尚未安装或重启；此时才出现重启 CTA', updateDialog.dataset.updateState === 'ready'
      && installCalls === 0 && updateDialog.querySelector('.update-primary').textContent === '重新启动以更新'
      && !updateDialog.querySelector('.update-close').disabled)
    updateDialog.querySelector('.update-primary').click()
    await settled()
    check('只有用户点击 ready CTA 才调用安装；安装错误可重试安装', updateDialog.dataset.updateState === 'error'
      && installCalls === 1 && updateDialog.querySelector('.update-primary').textContent === '重试安装')
    updateDialog.querySelector('.update-later').click()
    check('稍后操作进入 cancelled，并明确未安装、未重启', updateDialog.dataset.updateState === 'cancelled'
      && updateDialog.querySelector('.update-status-line').textContent.includes('更新未安装，也未重新启动'))
    await new Promise((resolve) => setTimeout(resolve, 230))
    check('取消只释放合成 updater 资源，不重复调用安装', closeCalls === 1 && installCalls === 1 && !updateDialog.isConnected,
      `close=${closeCalls}; install=${installCalls}; connected=${updateDialog.isConnected}`)

    const makeDismissOnlyUpdate = (onClose) => ({
      version: '0.2.0-fixture', currentVersion: '0.1.9-fixture', body: '本地合成关闭测试。',
      async download() { throw new Error('dismiss must not download') },
      async install() { throw new Error('dismiss must not install') },
      async close() { onClose() },
    })
    let xCloseCalls = 0
    const xDialog = presentUpdate(makeDismissOnlyUpdate(() => xCloseCalls++))
    xDialog.querySelector('.update-close').click()
    check('右上角 X 将更新提示标为稍后处理，不触发下载或安装', xDialog.dataset.updateState === 'cancelled'
      && xDialog.querySelector('.update-status-line').textContent.includes('更新未安装，也未重新启动'))
    await new Promise((resolve) => setTimeout(resolve, 230))
    check('X 仅释放提示资源并关闭卡片', xCloseCalls === 1 && !xDialog.isConnected,
      `close=${xCloseCalls}; connected=${xDialog.isConnected}`)

    let escapeCloseCalls = 0
    const escapeDialog = presentUpdate(makeDismissOnlyUpdate(() => escapeCloseCalls++))
    escapeDialog.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }))
    check('Escape 执行与稍后相同的可访问关闭操作', escapeDialog.dataset.updateState === 'cancelled'
      && escapeDialog.querySelector('.update-status-line').textContent.includes('更新未安装，也未重新启动'))
    await new Promise((resolve) => setTimeout(resolve, 230))
    check('Escape 仅释放提示资源，不触发更新动作', escapeCloseCalls === 1 && !escapeDialog.isConnected,
      `close=${escapeCloseCalls}; connected=${escapeDialog.isConnected}`)

    // Leave an inert, network-free preview visible for visual inspection.
    presentUpdate({ version: '0.2.0-fixture', currentVersion: '0.1.9-fixture', body: '### 版本说明\n- 这只是本地合成预览，不会访问更新服务器。' })

    window.__vaultFixtureResults = results
    report.dataset.finished = 'true'
    if (results.some((r) => !r.passed)) report.classList.add('fail')
  </script>
</body>
</html>
