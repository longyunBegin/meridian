<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meridian renderer interaction fixture</title>
</head>
<body>
  <main id="fixture-root"></main>
  <pre id="fixture-report" role="status">RUNNING</pre>
  <script type="module">
    import '../styles.css'
    import '../demo-theme.css'
    import '../demo-components.css'

    const proposals = [
      { id: 'proposal-rejected', type: 'engine.recommendation.proposed', payload: { pendingReview: true } },
      { id: 'proposal-evidence', type: 'engine.recommendation.proposed', payload: { pendingReview: true } },
      { id: 'proposal-relational', type: 'engine.recommendation.proposed', payload: { pendingReview: true } },
    ]
    const decisions = []
    const bridgeCalls = []
    const todoCalls = []
    const inboxResolved = []
    let generatedPipeline = null
    let pipelineCalls = 0
    window.meridian = {
      chainEvents: async () => ({ ok: true, events: [...proposals, ...decisions] }),
      /* P1-5 读者回流：待办走 inbox:upsertItem（不触发自动抽取），撤销走 inbox:resolve。 */
      inboxUpsertItem: async (item) => { todoCalls.push(item); return { ok: true, added: true, id: item.id } },
      inboxResolve: async (id, action) => { inboxResolved.push({ id, action }); return { ok: true } },
      engineRunPipeline: async (inboxId) => {
        pipelineCalls++
        return generatedPipeline ? { ok: true, inboxId, pipeline: generatedPipeline } : { ok: false, error: 'fixture pipeline missing' }
      },
      chainReviewEngineRecommendation: async (themeId, eventId, decision, input) => {
        bridgeCalls.push({ themeId, eventId, decision, input })
        if (decisions.some((event) => event.type === 'signal.reviewed' && event.payload.signalEventId === eventId)) {
          return { ok: true, replayed: true }
        }
        const resultEvents = []
        if (decision === 'accepted') {
          resultEvents.push({ id: `evidence:${eventId}`, type: 'evidence.appended', payload: { text: 'renderer fixture accepted quote', proposalEventId: eventId } })
          resultEvents.push({ id: `relation:${eventId}`, type: 'relation.declared', payload: { rel: input.rel || 'related', from: { eventId: `evidence:${eventId}` } } })
          if (eventId === 'proposal-evidence') resultEvents.push({ id: `confidence:${eventId}`, type: 'confidence.updated', payload: { oldConfidence: 100, newConfidence: 73.65, strength: 0.527 } })
        }
        resultEvents.push({ id: `review:${eventId}`, type: 'signal.reviewed', payload: { signalEventId: eventId, decision, change: input.change || null, rel: input.rel || null } })
        decisions.push(...resultEvents)
        return { ok: true, events: resultEvents }
      },
    }

    const check = (name, value) => {
      if (!value) throw new Error(`FAIL: ${name}`)
      results.push(`PASS: ${name}`)
    }
    const results = []
    const wait = () => new Promise((resolve) => setTimeout(resolve, 0))
    const waitFor = async (predicate, timeout = 3000) => {
      const deadline = Date.now() + timeout
      while (Date.now() < deadline) {
        if (predicate()) return true
        await new Promise((resolve) => setTimeout(resolve, 25))
      }
      return false
    }
    const node = (id, title, confidence) => ({
      id, nodeType: 'viewpoint', kind: 'claim', title, detail: '', currentText: title, confidence,
      status: 'pending', archived: false, external: false, createdSeq: 1, eventIds: [], provenanceEventIds: [],
      evidenceCount: 0,
    })

    try {
      const { renderEnginePipeline } = await import('../components/engine-review.js')
      const { renderReaderView } = await import('../views/reader.js')
      const item = {
        id: 'synthetic-inbox',
        createdAt: '2026-09-21T10:00:00.000Z',
        provenance: { platform: 'synthetic-test', sourceLabel: '隔离合成来源', url: 'https://example.test/synthetic-source', publishedAt: '2026-09-18', fetchedAt: '2026-09-21T09:55:00.000Z' },
        enginePipeline: {
          status: 'done',
          statements: [
            { subject: '合成公司', attribute: 'Q2营收', value: '增长', type: 'hard', timeWindow: '2026Q2', sourceText: '合成来源摘录 A。', sourceQuoteVerified: true },
            { subject: '合成公司', attribute: '产品', value: '尚待核实', type: 'soft', timeWindow: '', sourceText: '合成来源摘录 B。', sourceQuoteVerified: true },
          ],
          results: [
            { proposalEventId: 'proposal-rejected', kind: 'evidence', statement: { subject: '合成公司', attribute: 'Q2营收', value: '增长', sourceText: '合成来源摘录 A。', sourceQuoteVerified: true }, proposition: { title: '营收观点' }, recommendation: { kind: 'evidence', propositionTitle: '营收观点', rel: 'supports', strength: 0.6, effectiveStrength: 0.51, reason: '合成建议', change: { direction: 'improving', nature: 'quantitative', themeTag: '营收' } } },
            { proposalEventId: 'proposal-evidence', kind: 'evidence', requiresTemporalReview: true, statement: { subject: '合成公司', attribute: '产品', value: '尚待核实', sourceText: '合成来源摘录 B。', sourceQuoteVerified: true }, proposition: { id: 'synthetic-proposition-product', title: '产品观点' }, recommendation: { kind: 'evidence', propositionId: 'synthetic-proposition-product', propositionTitle: '产品观点', rel: 'supports', strength: 0.62, effectiveStrength: 0.527, matchScore: 0.84, reason: '合成时间窗未知', change: { direction: 'improving', nature: 'quantitative', themeTag: '产品' } } },
            { proposalEventId: 'proposal-relational', kind: 'new-proposition', suggestedTitle: '模型生成名称', statement: { subject: '供应链', attribute: '影响', value: '供需变化', sourceText: '合成关系来源摘录 C。', sourceQuoteVerified: true }, recommendation: { kind: 'new-proposition', title: '模型生成名称', rel: 'related', strength: 0.7, reason: '关系陈述仅供审核', change: { direction: 'stable', nature: 'structural', themeTag: '关系' } } },
          ],
        },
      }
      generatedPipeline = item.enginePipeline
      /* 归因建议要挂在已有原子上才测得到"关系类型由用户修正后送交"：
         目标原子必须出现在投影里，否则目标选择器会落到「＋ 新建原子」，
         而新建路径的关系由后端固定为 supports，不接受用户改的关系。 */
      const reviewProjection = { allNodes: [
        { id: 'synthetic-proposition-product', title: '产品观点', nodeType: 'viewpoint', status: 'pending', confidence: 64 },
      ] }
      const builderHost = document.createElement('section')
      builderHost.setAttribute('aria-label', '建设者引擎审阅')
      document.querySelector('#fixture-root').append(builderHost)
      builderHost.append(renderEnginePipeline(item, { themeId: 'synthetic-theme', projection: reviewProjection }))
      await wait()

      const cards = [...builderHost.querySelectorAll('.review-card-v2')]
      check(`正式引擎 renderer 输出三张可审阅卡与来源摘录（实际 ${cards.length} 张）`, cards.length === 3
        && cards.every((card) => card.querySelector('.review-quote-text')))
      check('未知时间不静默丢弃，卡片显示时间复核提示', builderHost.textContent.includes('时间窗口')
        && builderHost.textContent.includes('时间未注明'))
      check('所有候选都明确要求用户确认且提供驳回', cards.every((card) => card.textContent.includes('确认并追加')
        && [...card.querySelectorAll('button')].some((button) => button.textContent.includes('驳回'))))
      /* P0-5：变更预览旁的溯源条固定 5 格，缺项写「未记录」，有 URL 才给「查看来源」。 */
      check('P0-5 变更预览旁有固定 5 格溯源条',
        cards.every((card) => card.querySelectorAll('.review-trace-slot').length === 5))
      check('P0-5 溯源条五格分别是来源名称/链接/发布时间/抓取摄入/适用时间',
        [...cards[0].querySelectorAll('.review-trace-slot i')].map((el) => el.textContent.trim()).join(',')
          === '来源名称,来源链接,来源发布时间,抓取 / 摄入,适用时间')
      check('P0-5 有 URL 的条目给出「查看来源」，缺适用时间的条目如实写「未记录」',
        builderHost.querySelectorAll('.review-trace-link').length === 3
        && [...builderHost.querySelectorAll('.review-trace-slot b.is-missing')].some((el) => el.textContent.trim() === '未记录'))

      const byText = (root, text) => [...root.querySelectorAll('button')].find((button) => button.textContent.includes(text))
      byText(cards[0], '驳回').click()
      await wait()
      check('驳回通过专用审核 bridge，不调用直接证据写入', bridgeCalls[0]?.eventId === 'proposal-rejected'
        && bridgeCalls[0]?.decision === 'rejected' && !decisions.some((event) => event.type === 'evidence.appended' && event.payload.proposalEventId === 'proposal-rejected'))
      check('驳回后 live region 播报决定（role=status，视觉隐藏但确实在 DOM 里）',
        cards[0].querySelector('.engine-review-status')?.getAttribute('role') === 'status'
        && (cards[0].querySelector('.engine-review-status')?.textContent || '').includes('已驳回'),
        cards[0].querySelector('.engine-review-status')?.textContent || '(无)')

      /* 去领域化后的契约：高级选项只剩 目标原子 / 关系类型 / 备注；备注是自由文本。 */
      const evidenceCard = cards[1]
      const relationSelect = evidenceCard.querySelector('.engine-review-select')
      const noteInput = evidenceCard.querySelector('.engine-review-note')
      relationSelect.value = 'contradicts'
      noteInput.value = '复核备注'
      byText(evidenceCard, '确认并追加').click()
      await wait()
      const evidenceCall = bridgeCalls.find((call) => call.eventId === 'proposal-evidence')
      check('关系与自由备注的用户修正原样送交 main review command', evidenceCall?.decision === 'accepted'
        && evidenceCall.input.rel === 'contradicts'
        && JSON.stringify(evidenceCall.input.change) === JSON.stringify({ note: '复核备注' }))
      check('确认后 live region 播报已确认',
        (evidenceCard.querySelector('.engine-review-status')?.textContent || '').includes('已确认'),
        evidenceCard.querySelector('.engine-review-status')?.textContent || '(无)')
      check('确认后 mock 账本追加证据、关系、置信度更新和决定', ['evidence.appended', 'relation.declared', 'confidence.updated', 'signal.reviewed']
        .every((type) => decisions.some((event) => event.type === type)))

      const relationCard = cards[2]
      relationCard.querySelector('.engine-review-title').value = '用户命名关系观点'
      byText(relationCard, '确认并追加').click()
      await wait()
      const relationCall = bridgeCalls.find((call) => call.eventId === 'proposal-relational')
      check('新关系命题名称必须经人工编辑/确认后才提交', relationCall?.input.title === '用户命名关系观点'
        && decisions.some((event) => event.type === 'evidence.appended' && event.payload.proposalEventId === 'proposal-relational'))

      const refreshed = document.createElement('section')
      refreshed.setAttribute('aria-label', '刷新后的引擎审阅')
      refreshed.append(renderEnginePipeline(item, { themeId: 'synthetic-theme', projection: reviewProjection }))
      document.querySelector('#fixture-root').append(refreshed)
      await wait()
      check('重新挂载从追加 signal.reviewed 恢复接受/驳回状态且按钮禁用', [...refreshed.querySelectorAll('.review-card-v2')]
        .every((card) => card.classList.contains('is-done')
          /* 只要求"审阅动作"按钮禁用；溯源条的「查看来源」是只读导航，已决策后仍应可点。 */
          && [...card.querySelectorAll('.review-foot-actions button')].every((button) => button.disabled)
          && ![...card.querySelectorAll('button')].some((button) => /确认并追加|驳回/.test(button.textContent) && !button.disabled)))
      check('重复点击的权限受到禁用态阻止，没有二次调用 bridge', bridgeCalls.length === 3)

      const generateHost = document.createElement('section')
      generateHost.setAttribute('aria-label', '新建建议生成操作')
      const unsupportedItem = { id: 'synthetic-inbox-no-body' }
      const unsupportedBox = renderEnginePipeline(unsupportedItem, { themeId: 'synthetic-theme' })
      check('缺少可分析正文时模型运行入口禁用且不伪造抽取', unsupportedBox.querySelector('button').disabled
        && unsupportedBox.textContent.includes('仅凭标题或 URL 不会伪造抽取结果') && pipelineCalls === 0)
      const generateItem = { id: 'synthetic-inbox-run', text: '隔离合成原文：供应链交付周期出现变化。' }
      const generateBox = renderEnginePipeline(generateItem, { themeId: 'synthetic-theme' })
      generateHost.append(generateBox)
      document.querySelector('#fixture-root').append(generateHost)
      check('有正文时明确提供已配置模型的抽取/映射入口', generateBox.querySelector('button').textContent === '运行模型抽取与映射'
        && !generateBox.querySelector('button').disabled && generateBox.textContent.includes('确认或驳回前不会修改主题投影'))
      generateBox.querySelector('button').click()
      await wait()
      check('无缓存时模型运行按钮确实调用 engine:runPipeline bridge 并保存返回状态', pipelineCalls === 1
        && generateItem.enginePipeline?.status === 'done')
      generateHost.replaceChildren(renderEnginePipeline(generateItem, { themeId: 'synthetic-theme' }))
      check('pipeline 返回后正式 renderer 显示对应建议审阅卡', generateHost.querySelectorAll('.review-card-v2').length === 3)

      let openedNode = null
      const product = {
        ...node('vp-product', '产品判断', 100), detail: '原始说明（历史字段）', currentText: '更新后的产品判断。',
        eventIds: ['node-product-created', 'correction-product'], provenanceEventIds: ['node-product-created'],
        applicability: '2026Q2',
      }
      const driver = node('vp-driver', '供应链驱动', 48)
      const evidence = {
        id: 'ev-evidence', nodeType: 'evidence', kind: 'evidence', title: '隔离来源摘录', currentText: '仅供渲染测试的合成证据摘录。',
        detail: '', status: 'pending', createdSeq: 1, sourceKind: 'engine-reviewed', sourceRef: 'synthetic-source',
        eventIds: ['ev-evidence'], provenanceEventIds: ['ev-evidence'],
      }
      const support = { id: 'ev-support', eventId: 'ev-support', seq: 2, rel: 'supports', relationGroup: 'argument', from: evidence.id, to: product.id, pendingReview: false, reviewDecision: null }
      const association = { id: 'ev-association', eventId: 'ev-association', seq: 3, rel: 'influences', relationGroup: 'association', from: driver.id, to: product.id, pendingReview: false, reviewDecision: null }
      const revision = { id: 'ev-revision', eventId: 'ev-revision', seq: 5, rel: 'supersedes', relationGroup: 'revision', from: evidence.id, to: product.id, pendingReview: false, reviewDecision: null }
      const historyProjection = {
        nodes: [product, evidence], allNodes: [product, evidence], edges: [support], allEdges: [support], eventCount: 1,
        integrity: { ok: true, lastValidSeq: 1 },
      }
      const currentProjection = {
        nodes: [product, evidence, driver], allNodes: [product, evidence, driver], edges: [support, association, revision], allEdges: [support, association, revision], eventCount: 5,
        integrity: { ok: true, lastValidSeq: 5 },
      }
      const currentEvents = [
        { id: 'ev-evidence', seq: 1, at: '2026-09-20T12:00:00.000Z', type: 'evidence.appended', payload: {
          text: '仅供渲染测试的合成证据摘录。', sourceLabel: '隔离合成来源', sourceUrl: 'https://example.test/synthetic-source',
          sourcePublishedAt: '2026-09-18', sourceFetchedAt: '2026-09-21T09:55:00.000Z', ingestedAt: '2026-09-21T10:00:00.000Z',
          applicability: '2026Q2', scores: { matchScore: 0.84, attributionStrength: 0.62, effectiveStrength: 0.527 },
        } },
        { id: 'ev-support', seq: 2, at: '2026-09-21T12:00:00.000Z', type: 'relation.declared', payload: { rel: 'supports', from: { eventId: evidence.id }, to: { eventId: product.id } } },
        { id: 'ev-association', seq: 3, at: '2026-09-22T12:00:00.000Z', type: 'relation.declared', payload: { rel: 'influences', from: { eventId: driver.id }, to: { eventId: product.id } } },
        { id: 'correction-product', seq: 4, at: '2026-09-23T08:00:00.000Z', type: 'correction.appended', supersedes: 'node-product-created', payload: {
          oldValue: '原始说明（历史字段）', newValue: '更新后的产品判断。', text: '修订所依据的合成来源摘录。',
          sourceKind: 'engine-reviewed', sourceLabel: '隔离修订来源', sourceUrl: 'https://example.test/revision-source',
          sourcePublishedAt: '2026-09-18', sourceFetchedAt: '2026-09-22T09:00:00.000Z', ingestedAt: '2026-09-21T10:00:00.000Z',
          applicability: '2026Q2', scores: { matchScore: 0.82, attributionStrength: 0.6 },
        } },
        { id: 'ev-revision', seq: 5, at: '2026-09-23T08:01:00.000Z', type: 'relation.declared', payload: {
          rel: 'supersedes', from: { eventId: evidence.id }, to: { eventId: product.id },
        } },
      ]
      const historyEvents = currentEvents.slice(0, 1)
      const renderReader = (projection, events) => renderReaderView({ name: '隔离合成主题' }, {
        loadProjection: async () => projection, loadEvents: async () => events,
        loadProjectionAt: async (sequence) => sequence <= 1 ? historyProjection : currentProjection,
        onOpenBuilder: (kind, id) => { openedNode = `${kind}:${id}` },
      })
      const historicRoot = renderReader(historyProjection, historyEvents)
      const currentRoot = renderReader(currentProjection, currentEvents)
      historicRoot.setAttribute('data-snapshot', 'history')
      currentRoot.setAttribute('data-snapshot', 'current')
      document.querySelector('#fixture-root').append(historicRoot, currentRoot)
      await wait()
      check('读者视图以观点分簇缩略图为主结构，并明确拒绝由支持数推导整体走向',
        Boolean(currentRoot.querySelector('.rdr-cluster-canvas'))
        && !currentRoot.querySelector('.rdr-overall-direction')
        && currentRoot.textContent.includes('颜色 = 证据状况'))
      /* 用户决定：读者页不要时间回放（播放 / 与当前对比 / 返回当前模型）。
         回放 UI 已从界面移除，这里改为断言"回放块不可见"；原来的 4 条行为断言
         （时间线对比 / 播放推进 / 暂停 / 返回当前状态）随功能一起下线——
         通过数会因此减少，这是覆盖范围变化，不是回归。
         注意：回放块内部 DOM 暂留（下一步连代码一起清），所以不断言元素不存在。 */
      check('读者页不再展示时间回放（播放 / 与当前对比 / 返回当前模型）',
        !currentRoot.querySelector('.rdr-replay-details'))

      /* 整体情况（设计提案 01）：强度线 × 来源点 × 确认/修订台阶，同一条日期轴。 */
      const axisEvents = [
        { id: 'ax-e1', seq: 1, at: '2026-09-20T00:00:00.000Z', type: 'evidence.appended', payload: { text: '第一条来源' } },
        { id: 'ax-r1', seq: 2, at: '2026-09-21T00:00:00.000Z', type: 'relation.declared', payload: { rel: 'supports', from: { eventId: 'ax-e1' }, to: { eventId: 'ax-v1' } } },
        { id: 'ax-e2', seq: 3, at: '2026-09-22T00:00:00.000Z', type: 'evidence.appended', payload: { text: '第二条来源' } },
        { id: 'ax-c1', seq: 4, at: '2026-09-23T00:00:00.000Z', type: 'confidence.updated', payload: { nodeId: 'ax-v1', oldConfidence: 62, newConfidence: 67, reason: '支持证据' } },
        { id: 'ax-c2', seq: 5, at: '2026-09-24T00:00:00.000Z', type: 'confidence.updated', payload: { nodeId: 'ax-v1', oldConfidence: 67, newConfidence: 71, reason: '又一条支持' } },
        { id: 'ax-s1', seq: 6, at: '2026-09-25T00:00:00.000Z', type: 'signal.reviewed', payload: { decision: 'accepted' } },
      ]
      const axisNode = {
        id: 'ax-v1', nodeType: 'viewpoint', kind: 'claim', title: '整体情况原子', detail: '', currentText: '整体情况原子',
        confidence: 71, status: 'pending', archived: false, external: false, createdSeq: 1, eventIds: [], provenanceEventIds: [], evidenceCount: 2,
        confidenceHistory: [
          { at: '2026-09-23T00:00:00.000Z', oldConfidence: 62, newConfidence: 67, reason: '支持证据' },
          { at: '2026-09-24T00:00:00.000Z', oldConfidence: 67, newConfidence: 71, reason: '又一条支持' },
        ],
      }
      const axisProjection = { nodes: [axisNode], allNodes: [axisNode], edges: [], allEdges: [], integrity: { ok: true }, eventCount: axisEvents.length }
      const axisRoot = renderReaderView({ name: '整体情况合成主题' }, {
        loadProjection: async () => axisProjection, loadEvents: async () => axisEvents, onOpenBuilder: () => {},
      })
      document.querySelector('#fixture-root').append(axisRoot)
      await wait()
      /* 选择方式改为点小倍数卡片：它和画布节点走同一条 focusAtom 路径（会联动检视器与合成轴）。 */
      axisRoot.querySelector('.rdr-multiple-card')?.click()
      await wait()
      const axisSvg = axisRoot.querySelector('.rdr-axis-svg')
      check('整体情况：选中原子后强度线按 confidence 历史画成折线',
        axisSvg?.querySelector('.rdr-axis-line')?.getAttribute('data-points') === '2',
        axisSvg?.querySelector('.rdr-axis-line')?.getAttribute('data-points') || '(无线)')
      check('整体情况：来源落在同一条日期轴的轨道上，按支持/未表态上色',
        axisSvg?.querySelectorAll('.rdr-axis-evidence').length === 2
        && Boolean(axisSvg.querySelector('.rdr-axis-evidence.is-supports'))
        && Boolean(axisSvg.querySelector('.rdr-axis-evidence.is-unstated')))
      check('整体情况：确认/修订画成台阶，标题栏如实播报计数与当前强度',
        axisSvg?.querySelectorAll('.rdr-axis-step').length === 1
        && (axisRoot.querySelector('.rdr-axis-caption')?.textContent || '').includes('2 条来源')
        && (axisRoot.querySelector('.rdr-axis-caption')?.textContent || '').includes('强度 71%'))

      /* R1 理由清单 + R2 小倍数网格（§10.2 第 2/3 屏）：有序主结构 */
      const structureEvidence = (id, title, extra = {}) => ({
        id, nodeType: 'evidence', kind: 'evidence', title, currentText: title, status: 'pending', archived: false, external: false,
        createdSeq: 1, eventIds: [], provenanceEventIds: [], targetNodeIds: ['sx-v1'], evidenceCount: 0,
        evidenceRefs: [{ type: 'url', id: 'https://example.test/r1-source', title: '示例来源' }],
        sourceLabel: '示例来源', sourcePublishedAt: '2026-09-20', applicability: '2026Q3', ...extra,
      })
      const structureNodes = [
        {
          id: 'sx-v1', nodeType: 'viewpoint', kind: 'claim', title: 'R1 结论原子', currentText: 'R1 结论原子',
          confidence: 71, status: 'pending', archived: false, external: false, createdSeq: 1, eventIds: [], provenanceEventIds: [],
          evidenceNodeIds: ['sx-e1', 'sx-e2', 'sx-e3'], evidenceCount: 3, atomCategory: '技术路线',
          confidenceHistory: [
            { at: '2026-09-23T00:00:00.000Z', oldConfidence: 62, newConfidence: 67 },
            { at: '2026-09-24T00:00:00.000Z', oldConfidence: 67, newConfidence: 71 },
          ],
        },
        { id: 'sx-v2', nodeType: 'viewpoint', kind: 'claim', title: 'R1 无证据原子', currentText: 'R1 无证据原子', confidence: null, status: 'pending', archived: false, external: false, createdSeq: 2, eventIds: [], provenanceEventIds: [], evidenceCount: 0, atomCategory: '商业模式' },
        structureEvidence('sx-e1', '支持用的来源', { applicability: '2020Q1' }),
        structureEvidence('sx-e2', '挑战用的来源', { applicability: '2099' }),
        structureEvidence('sx-e3', '未表态的来源', { evidenceRefs: [], sourceLabel: null, sourceUrl: null, sourcePublishedAt: null, applicability: null }),
      ]
      const structureEdges = [
        { id: 'sx-r1', from: 'sx-e1', to: 'sx-v1', rel: 'supports', reviewDecision: null, pendingReview: false },
        { id: 'sx-r2', from: 'sx-e2', to: 'sx-v1', rel: 'contradicts', reviewDecision: null, pendingReview: false },
        { id: 'sx-r3', from: 'sx-v1', to: 'sx-v2', rel: 'related', reviewDecision: null, pendingReview: false },
      ]
      const structureProjection = { nodes: structureNodes, allNodes: structureNodes, edges: structureEdges, allEdges: structureEdges, integrity: { ok: true }, eventCount: 2 }
      /* 时间线要按事件流读：这里让事件 id 与投影证据节点 id 对齐（真实数据就是同一批 id）。 */
      const structureEvents = [
        { id: 'sx-e1', seq: 1, at: '2026-09-20T00:00:00.000Z', type: 'evidence.appended', payload: { text: '支持用的来源' } },
        { id: 'sx-rel1', seq: 2, at: '2026-09-20T01:00:00.000Z', type: 'relation.declared', payload: { rel: 'supports', from: { eventId: 'sx-e1' }, to: { eventId: 'sx-v1' } } },
        { id: 'sx-c1', seq: 3, at: '2026-09-20T01:00:01.000Z', type: 'confidence.updated', payload: { nodeId: 'sx-v1', evidenceEventId: 'sx-e1', oldConfidence: 62, newConfidence: 67 } },
        { id: 'sx-e2', seq: 4, at: '2026-09-25T00:00:00.000Z', type: 'evidence.appended', payload: { text: '挑战用的来源' } },
        { id: 'sx-rel2', seq: 5, at: '2026-09-25T01:00:00.000Z', type: 'relation.declared', payload: { rel: 'contradicts', from: { eventId: 'sx-e2' }, to: { eventId: 'sx-v1' } } },
        { id: 'sx-e3', seq: 6, at: '2026-09-26T00:00:00.000Z', type: 'evidence.appended', payload: { text: '未表态的来源' } },
      ]
      const structureRoot = renderReaderView({ name: '大纲合成主题', config: { atomCategories: ['技术路线', '商业模式'], relationLabels: [] } }, {
        loadProjection: async () => structureProjection, loadEvents: async () => structureEvents, onOpenBuilder: () => {},
        loadInbox: async () => ([{ id: 'inbox-unassigned', status: 'pending', title: '未归位条目', text: '还没归主题' }]),
      })
      document.querySelector('#fixture-root').append(structureRoot)
      await wait()
      check('R1 理由清单：每个原子一行结论，支持/挑战/未表态三组都在',
        structureRoot.querySelectorAll('.rdr-outline-atom').length === 2
        && structureRoot.querySelectorAll('.rdr-outline-group.is-supports').length === 2
        && structureRoot.querySelectorAll('.rdr-outline-group.is-against').length === 2
        && structureRoot.querySelectorAll('.rdr-outline-group.is-unclassified').length === 2)
      check('R1 大纲按立场分组来源，带来源名、时间与「查看来源」',
        structureRoot.querySelectorAll('.rdr-outline-group.is-supports .rdr-outline-item').length === 1
        && structureRoot.querySelectorAll('.rdr-outline-group.is-against .rdr-outline-item').length === 1
        && (structureRoot.querySelector('.rdr-outline-item-meta')?.textContent || '').includes('示例来源')
        && structureRoot.querySelectorAll('.rdr-outline-link').length === 2)
      check('R1 大纲文案里不出现账本术语（事件 / seq / 哈希）',
        !/事件|seq|哈希/.test(structureRoot.querySelector('.rdr-outline')?.textContent || ''),
        structureRoot.querySelector('.rdr-outline')?.textContent?.slice(0, 60) || '')
      check('R2 小倍数网格：每原子一卡，含强度条 / sparkline / 支持挑战计数 / 分类色点',
        structureRoot.querySelectorAll('.rdr-multiple-card').length === 2
        && Boolean(structureRoot.querySelector('.rdr-multiple-card[data-atom-id="sx-v1"] .rdr-multiple-spark polyline'))
        && (structureRoot.querySelector('.rdr-multiple-card[data-atom-id="sx-v1"] .rdr-multiple-counts')?.textContent || '').includes('1 支持')
        && (structureRoot.querySelector('.rdr-multiple-card[data-atom-id="sx-v2"] .rdr-multiple-value')?.textContent || '').includes('还没有强度')
        && structureRoot.querySelectorAll('.rdr-multiple-cat').length === 2)
      check('R2 没有强度历史的原子如实留白（虚线），不假装平稳',
        Boolean(structureRoot.querySelector('.rdr-multiple-card[data-atom-id="sx-v2"] .rdr-multiple-spark line')))
      structureRoot.querySelector('.rdr-multiple-card[data-atom-id="sx-v1"]')?.click()
      await wait()
      check('R2 点卡片聚焦该原子并联动检视器', structureRoot.querySelector('.rdr-inspector-title')?.textContent === 'R1 结论原子'
        && Boolean(structureRoot.querySelector('.rdr-multiple-card.is-selected')))

      /* R3 正反两方 / R4 时间线 */
      check('R3 正反两方并排列出支持与挑战，并标出争议行',
        structureRoot.querySelectorAll('.rdr-debate-row').length === 1
        && Boolean(structureRoot.querySelector('.rdr-debate-row.is-contested'))
        && structureRoot.querySelectorAll('.rdr-debate-col.is-supports .rdr-debate-item').length === 1
        && structureRoot.querySelectorAll('.rdr-debate-col.is-against .rdr-debate-item').length === 1
        && (structureRoot.querySelector('.rdr-debate-strength')?.textContent || '').includes('71%'))
      structureRoot.querySelector('.rdr-debate-col.is-against .rdr-debate-link')?.click()
      await wait()
      check('R3 点某条挑战跳到该来源的详情',
        structureRoot.querySelector('.rdr-inspector-title')?.textContent === '挑战用的来源')
      const chronicleItems = [...structureRoot.querySelectorAll('.rdr-chronicle-item')]
      check('R4 时间线一行一条来源，带日期/来源/归入原子/立场/强度变化',
        chronicleItems.length === 3
        && chronicleItems[0].querySelector('.rdr-chronicle-date')?.textContent === '2026-09-26'
        && (structureRoot.querySelector('.rdr-chronicle-item.is-supports .rdr-chronicle-delta')?.textContent || '').includes('62% → 67%')
        && (structureRoot.querySelector('.rdr-chronicle-item.is-contradicts .rdr-chronicle-stance')?.textContent || '') === '挑战'
        && (structureRoot.querySelector('.rdr-chronicle-item.is-supports .rdr-chronicle-meta')?.textContent || '').includes('归入 R1 结论原子')
        && (structureRoot.querySelector('.rdr-chronicle-item.is-supports .rdr-chronicle-meta')?.textContent || '').includes('示例来源'))
      check('R4 时间线不出现账本术语（事件序号 / 哈希）',
        !/seq|哈希|第 \d+ 条/.test(structureRoot.querySelector('.rdr-chronicle')?.textContent || ''))

      /* R6 对照表 + ≥300 节点自动替代图 */
      check('R6 矩阵行列重排后区分支持 / 挑战 / 挂上未表态',
        structureRoot.querySelectorAll('.rdr-matrix-row').length === 2
        && Boolean(structureRoot.querySelector('.rdr-matrix-cell.is-supports'))
        && Boolean(structureRoot.querySelector('.rdr-matrix-cell.is-contradicts'))
        && Boolean(structureRoot.querySelector('.rdr-matrix-cell.is-attached')))
      structureRoot.querySelector('.rdr-matrix-cell.is-supports .rdr-matrix-dot')?.click()
      await wait()
      check('R6 点击矩阵单元格定位到该来源',
        structureRoot.querySelector('.rdr-inspector-title')?.textContent === '支持用的来源')
      structureRoot.querySelector('.rdr-matrix-mode[aria-pressed="false"]')?.click()
      await wait()
      check('R6 可切原子 × 原子（来源的边不算原子间关系；对称关系两个方向都填充）',
        structureRoot.querySelectorAll('.rdr-matrix-row').length === 2
        && structureRoot.querySelectorAll('.rdr-matrix-table .rdr-matrix-cell.is-related').length === 2
        && structureRoot.querySelectorAll('.rdr-matrix-table .rdr-matrix-cell.is-empty').length === 2)
      const bigNodes = [{
        id: 'big-v1', nodeType: 'viewpoint', kind: 'claim', title: '大主题原子', detail: '', currentText: '大主题原子',
        confidence: 60, status: 'pending', archived: false, external: false, createdSeq: 1, eventIds: [], provenanceEventIds: [], evidenceCount: 300,
      }]
      for (let index = 0; index < 300; index++) {
        bigNodes.push({
          id: `big-e${index}`, nodeType: 'evidence', kind: 'evidence', title: `来源 ${index}`, currentText: `来源 ${index}`,
          status: 'pending', archived: false, external: false, createdSeq: index + 2, eventIds: [], provenanceEventIds: [],
          targetNodeIds: ['big-v1'], evidenceCount: 0,
        })
      }
      const bigProjection = { nodes: bigNodes, allNodes: bigNodes, edges: [], allEdges: [], integrity: { ok: true }, eventCount: 1 }
      const bigRoot = renderReaderView({ name: '大规模合成主题' }, {
        loadProjection: async () => bigProjection, loadEvents: async () => [], onOpenBuilder: () => {},
      })
      document.querySelector('#fixture-root').append(bigRoot)
      await wait()
      check('R7 分类聚合按分类给出原子/来源计数，并标出缺数据的分类',
        structureRoot.querySelectorAll('.rdr-category-row').length === 2
        && (structureRoot.querySelector('.rdr-category-row .rdr-category-figures')?.textContent || '').includes('原子')
        && Boolean(structureRoot.querySelector('.rdr-category-gap')))
      check('R6 ≥300 节点时改由矩阵承载结构并如实标注（图谱已下线，不再假装画完了）',
        (bigRoot.textContent || '').includes('矩阵')
        && Boolean(bigRoot.querySelector('.rdr-matrix-degraded'))
        && bigRoot.querySelectorAll('.rdr-matrix-row').length === 1)

      /* R5 还缺什么 + P1-5 回流 */
      const gapItems = [...structureRoot.querySelectorAll('.rdr-gap-item')]
      check('R5 还缺什么覆盖缺来源 / 已过期 / 未归位三类',
        gapItems.length === 3
        && gapItems.some((el) => el.textContent.includes('还没有来源'))
        && gapItems.some((el) => el.textContent.includes('来源过期了'))
        && gapItems.some((el) => el.textContent.includes('没归到任何观点')),
        gapItems.map((el) => el.querySelector('.rdr-gap-kind')?.textContent.trim()).join('/'))
      check('R5 还缺什么不把没过的证据算成过期',
        !gapItems.some((el) => el.textContent.includes('挑战用的来源')))
      const todoButton = gapItems[0].querySelector('.rdr-gap-todo')
      todoButton.click()
      await wait()
      check('P1-5 加入待办写进收件箱且是 todo 类型（不触发自动抽取）',
        todoCalls.length === 1 && todoCalls[0].kind === 'todo' && todoCalls[0].extracted === false
        && todoCalls[0].text.includes('补一条来源') && todoCalls[0].provenance?.platform === 'reader-gap',
        JSON.stringify(todoCalls[0] || null))
      check('P1-5 已加入待办的缺口标成"已在收件箱"', Boolean(structureRoot.querySelector('.rdr-gap-done')))
      const toastButton = [...document.querySelectorAll('.toast-btn')].pop()
      check('P1-5 回流提示带撤销按钮', toastButton?.textContent === '撤销')
      toastButton?.click()
      await wait()
      check('P1-5 撤销把刚建的待办移出收件箱',
        inboxResolved.length === 1 && inboxResolved[0].id === todoCalls[0].id && inboxResolved[0].action === 'reject'
        && !structureRoot.querySelector('.rdr-gap-done'))
      /* 「标记缺口」需要一个选中原子；原来这个选中态由画布选择建立，图下线后改为显式点一次卡片。 */
      structureRoot.querySelector('.rdr-multiple-card[data-atom-id="sx-v1"]')?.click()
      await wait()
      structureRoot.querySelector('.rdr-gap-mark').click()
      await wait()
      check('P1-5「标记缺口」对选中原子记一条待办',
        todoCalls.length === 2 && todoCalls[1].text.includes('R1 结论原子'),
        JSON.stringify(todoCalls[1] || null))

      document.querySelector('#fixture-report').textContent = `PASS (${results.length})\n${results.join('\n')}`
      document.body.dataset.fixture = 'pass'
    } catch (error) {
      results.push(`FAIL: ${error.stack || error}`)
      document.querySelector('#fixture-report').textContent = results.join('\n')
      document.body.dataset.fixture = 'fail'
      throw error
    }
  </script>
</body>
