<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meridian renderer interaction fixture</title>
</head>
<body>
  <main id="fixture-root"></main>
  <pre id="fixture-report" role="status">RUNNING</pre>
  <script type="module">
    import '../styles.css'
    import '../demo-theme.css'
    import '../demo-components.css'

    const proposals = [
      { id: 'proposal-rejected', type: 'engine.recommendation.proposed', payload: { pendingReview: true } },
      { id: 'proposal-evidence', type: 'engine.recommendation.proposed', payload: { pendingReview: true } },
      { id: 'proposal-relational', type: 'engine.recommendation.proposed', payload: { pendingReview: true } },
    ]
    const decisions = []
    const bridgeCalls = []
    const todoCalls = []
    const inboxResolved = []
    let generatedPipeline = null
    let pipelineCalls = 0
    window.meridian = {
      chainEvents: async () => ({ ok: true, events: [...proposals, ...decisions] }),
      /* P1-5 读者回流：待办走 inbox:upsertItem（不触发自动抽取），撤销走 inbox:resolve。 */
      inboxUpsertItem: async (item) => { todoCalls.push(item); return { ok: true, added: true, id: item.id } },
      inboxResolve: async (id, action) => { inboxResolved.push({ id, action }); return { ok: true } },
      engineRunPipeline: async (inboxId) => {
        pipelineCalls++
        return generatedPipeline ? { ok: true, inboxId, pipeline: generatedPipeline } : { ok: false, error: 'fixture pipeline missing' }
      },
      chainReviewEngineRecommendation: async (themeId, eventId, decision, input) => {
        bridgeCalls.push({ themeId, eventId, decision, input })
        if (decisions.some((event) => event.type === 'signal.reviewed' && event.payload.signalEventId === eventId)) {
          return { ok: true, replayed: true }
        }
        const resultEvents = []
        if (decision === 'accepted' || decision === 'corrected') {
          resultEvents.push({ id: `evidence:${eventId}`, type: 'evidence.appended', payload: { text: 'renderer fixture accepted quote', proposalEventId: eventId } })
          resultEvents.push({ id: `relation:${eventId}`, type: 'relation.declared', payload: { rel: input.rel || 'related', from: { eventId: `evidence:${eventId}` } } })
          if (eventId === 'proposal-evidence') resultEvents.push({ id: `confidence:${eventId}`, type: 'confidence.updated', payload: { oldConfidence: 100, newConfidence: 73.65, strength: 0.527 } })
        }
        resultEvents.push({ id: `review:${eventId}`, type: 'signal.reviewed', payload: { signalEventId: eventId, decision, change: input.change || null, rel: input.rel || null } })
        decisions.push(...resultEvents)
        return { ok: true, events: resultEvents }
      },
    }

    const check = (name, value) => {
      if (!value) throw new Error(`FAIL: ${name}`)
      results.push(`PASS: ${name}`)
    }
    const results = []
    const wait = () => new Promise((resolve) => setTimeout(resolve, 0))
    const waitFor = async (predicate, timeout = 3000) => {
      const deadline = Date.now() + timeout
      while (Date.now() < deadline) {
        if (predicate()) return true
        await new Promise((resolve) => setTimeout(resolve, 25))
      }
      return false
    }
    const node = (id, title, confidence) => ({
      id, nodeType: 'viewpoint', kind: 'claim', title, detail: '', currentText: title, confidence,
      status: 'pending', archived: false, external: false, createdSeq: 1, eventIds: [], provenanceEventIds: [],
      evidenceCount: 0,
    })

    try {
      const { renderEnginePipeline } = await import('../components/engine-review.js')
      const { renderReaderView } = await import('../views/reader.js')
      const item = {
        id: 'synthetic-inbox',
        createdAt: '2026-09-21T10:00:00.000Z',
        provenance: { platform: 'synthetic-test', sourceLabel: '隔离合成来源', url: 'https://www.reuters.com/fixture/synthetic-source', publishedAt: '2026-09-18', fetchedAt: '2026-09-21T09:55:00.000Z' },
        enginePipeline: {
          status: 'done',
          statements: [
            { subject: '合成公司', attribute: 'Q2营收', value: '增长', type: 'hard', timeWindow: '2026Q2', sourceText: '合成来源摘录 A。', sourceQuoteVerified: true },
            { subject: '合成公司', attribute: '产品', value: '尚待核实', type: 'soft', timeWindow: '', sourceText: '合成来源摘录 B。', sourceQuoteVerified: true },
          ],
          results: [
            { proposalEventId: 'proposal-rejected', kind: 'evidence', statement: { subject: '合成公司', attribute: 'Q2营收', value: '增长', sourceText: '合成来源摘录 A。', sourceQuoteVerified: true }, proposition: { title: '营收观点' }, recommendation: { kind: 'evidence', propositionTitle: '营收观点', rel: 'supports', strength: 0.6, effectiveStrength: 0.51, reason: '合成建议', change: { direction: 'improving', nature: 'quantitative', themeTag: '营收' } } },
            { proposalEventId: 'proposal-evidence', kind: 'evidence', requiresTemporalReview: true, statement: { subject: '合成公司', attribute: '产品', value: '尚待核实', sourceText: '合成来源摘录 B。', sourceQuoteVerified: true }, proposition: { id: 'synthetic-proposition-product', title: '产品观点' }, recommendation: { kind: 'evidence', propositionId: 'synthetic-proposition-product', propositionTitle: '产品观点', rel: 'supports', strength: 0.62, effectiveStrength: 0.527, matchScore: 0.84, reason: '合成时间窗未知', change: { direction: 'improving', nature: 'quantitative', themeTag: '产品' } } },
            { proposalEventId: 'proposal-relational', kind: 'new-proposition', suggestedTitle: '模型生成名称', statement: { subject: '供应链', attribute: '影响', value: '供需变化', sourceText: '合成关系来源摘录 C。', sourceQuoteVerified: true }, recommendation: { kind: 'new-proposition', title: '模型生成名称', rel: 'related', strength: 0.7, reason: '关系陈述仅供审核', change: { direction: 'stable', nature: 'structural', themeTag: '关系' } } },
          ],
        },
      }
      generatedPipeline = item.enginePipeline
      /* 归因建议要挂在已有原子上才测得到"关系类型由用户修正后送交"：
         目标原子必须出现在投影里，否则目标选择器会落到「＋ 新建原子」，
         而新建路径的关系由后端固定为 supports，不接受用户改的关系。 */
      const reviewProjection = { allNodes: [
        { id: 'synthetic-proposition-product', title: '产品观点', nodeType: 'viewpoint', status: 'pending', confidence: 64 },
      ] }
      const builderHost = document.createElement('section')
      builderHost.setAttribute('aria-label', '建设者引擎审阅')
      document.querySelector('#fixture-root').append(builderHost)
      builderHost.append(renderEnginePipeline(item, { themeId: 'synthetic-theme', projection: reviewProjection }))
      await wait()

      const cards = [...builderHost.querySelectorAll('.review-card-v2')]
      check(`正式引擎 renderer 输出三张可审阅卡与来源摘录（实际 ${cards.length} 张）`, cards.length === 3
        && cards.every((card) => card.querySelector('.review-quote-text')))
      check('未知时间不静默丢弃，卡片显示时间复核提示', builderHost.textContent.includes('时间窗口')
        && builderHost.textContent.includes('时间未注明'))
      check('所有候选都明确要求用户确认且提供驳回', cards.every((card) => card.textContent.includes('确认并追加')
        && [...card.querySelectorAll('button')].some((button) => button.textContent.includes('驳回'))))
      /* P0-5：变更预览旁的溯源条固定 5 格，缺项写「未记录」，有 URL 才给「查看来源」。 */
      check('P0-5 变更预览旁有固定 5 格溯源条',
        cards.every((card) => card.querySelectorAll('.review-trace-slot').length === 5))
      check('P0-5 溯源条五格分别是来源名称/链接/发布时间/抓取摄入/适用时间',
        [...cards[0].querySelectorAll('.review-trace-slot i')].map((el) => el.textContent.trim()).join(',')
          === '来源名称,来源链接,来源发布时间,抓取 / 摄入,适用时间')
      check('P0-5 有 URL 的条目给出「查看来源」，缺适用时间的条目如实写「未记录」',
        builderHost.querySelectorAll('.review-trace-link').length === 3
        && [...builderHost.querySelectorAll('.review-trace-slot b.is-missing')].some((el) => el.textContent.trim() === '未记录'))

      const byText = (root, text) => [...root.querySelectorAll('button')].find((button) => button.textContent.includes(text))
      byText(cards[0], '驳回').click()
      await wait()
      check('驳回通过专用审核 bridge，不调用直接证据写入', bridgeCalls[0]?.eventId === 'proposal-rejected'
        && bridgeCalls[0]?.decision === 'rejected' && !decisions.some((event) => event.type === 'evidence.appended' && event.payload.proposalEventId === 'proposal-rejected'))
      check('驳回后 live region 播报决定（role=status，视觉隐藏但确实在 DOM 里）',
        cards[0].querySelector('.engine-review-status')?.getAttribute('role') === 'status'
        && (cards[0].querySelector('.engine-review-status')?.textContent || '').includes('已驳回'),
        cards[0].querySelector('.engine-review-status')?.textContent || '(无)')

      /* 人工覆盖在主路径：目标 / 关系 / 权重可见可改；备注仍在折叠区。改过记 corrected。 */
      const evidenceCard = cards[1]
      check('归因覆盖控件在主路径，不藏进高级选项', !!evidenceCard.querySelector('.review-override')
        && evidenceCard.querySelector('.review-override')?.textContent.includes('可改'))
      const relationSelect = evidenceCard.querySelector('.engine-review-select')
      const noteInput = evidenceCard.querySelector('.engine-review-note')
      relationSelect.value = 'contradicts'
      relationSelect.dispatchEvent(new Event('change', { bubbles: true }))
      noteInput.value = '复核备注'
      byText(evidenceCard, '确认并追加').click()
      await wait()
      const evidenceCall = bridgeCalls.find((call) => call.eventId === 'proposal-evidence')
      check('关系与自由备注的用户修正原样送交 main review command，并记成 corrected', evidenceCall?.decision === 'corrected'
        && evidenceCall.input.rel === 'contradicts'
        && JSON.stringify(evidenceCall.input.change) === JSON.stringify({ note: '复核备注' }))
      check('确认后 live region 播报已确认',
        (evidenceCard.querySelector('.engine-review-status')?.textContent || '').includes('已确认'),
        evidenceCard.querySelector('.engine-review-status')?.textContent || '(无)')
      check('确认后 mock 账本追加证据、关系、置信度更新和决定', ['evidence.appended', 'relation.declared', 'confidence.updated', 'signal.reviewed']
        .every((type) => decisions.some((event) => event.type === type)))

      const relationCard = cards[2]
      relationCard.querySelector('.engine-review-title').value = '用户命名关系观点'
      byText(relationCard, '确认并追加').click()
      await wait()
      const relationCall = bridgeCalls.find((call) => call.eventId === 'proposal-relational')
      check('新关系命题名称必须经人工编辑/确认后才提交', relationCall?.input.title === '用户命名关系观点'
        && decisions.some((event) => event.type === 'evidence.appended' && event.payload.proposalEventId === 'proposal-relational'))

      const refreshed = document.createElement('section')
      refreshed.setAttribute('aria-label', '刷新后的引擎审阅')
      refreshed.append(renderEnginePipeline(item, { themeId: 'synthetic-theme', projection: reviewProjection }))
      document.querySelector('#fixture-root').append(refreshed)
      await wait()
      check('重新挂载从追加 signal.reviewed 恢复接受/驳回状态且按钮禁用', [...refreshed.querySelectorAll('.review-card-v2')]
        .every((card) => card.classList.contains('is-done')
          /* 只要求"审阅动作"按钮禁用；溯源条的「查看来源」是只读导航，已决策后仍应可点。 */
          && [...card.querySelectorAll('.review-foot-actions button')].every((button) => button.disabled)
          && ![...card.querySelectorAll('button')].some((button) => /确认并追加|驳回/.test(button.textContent) && !button.disabled)))
      check('重复点击的权限受到禁用态阻止，没有二次调用 bridge', bridgeCalls.length === 3)

      const generateHost = document.createElement('section')
      generateHost.setAttribute('aria-label', '新建建议生成操作')
      const unsupportedItem = { id: 'synthetic-inbox-no-body' }
      const unsupportedBox = renderEnginePipeline(unsupportedItem, { themeId: 'synthetic-theme' })
      check('缺少可分析正文时模型运行入口禁用且不伪造抽取', unsupportedBox.querySelector('button').disabled
        && unsupportedBox.textContent.includes('仅凭标题或 URL 不会伪造抽取结果') && pipelineCalls === 0)
      const generateItem = { id: 'synthetic-inbox-run', text: '隔离合成原文：供应链交付周期出现变化。' }
      const generateBox = renderEnginePipeline(generateItem, { themeId: 'synthetic-theme' })
      generateHost.append(generateBox)
      document.querySelector('#fixture-root').append(generateHost)
      check('有正文时明确提供已配置模型的抽取/映射入口', generateBox.querySelector('button').textContent === '运行模型抽取与映射'
        && !generateBox.querySelector('button').disabled && generateBox.textContent.includes('确认或驳回前不会修改主题投影'))
      generateBox.querySelector('button').click()
      await wait()
      check('无缓存时模型运行按钮确实调用 engine:runPipeline bridge 并保存返回状态', pipelineCalls === 1
        && generateItem.enginePipeline?.status === 'done')
      generateHost.replaceChildren(renderEnginePipeline(generateItem, { themeId: 'synthetic-theme' }))
      check('pipeline 返回后正式 renderer 显示对应建议审阅卡', generateHost.querySelectorAll('.review-card-v2').length === 3)

      let openedNode = null
      const product = {
        ...node('vp-product', '产品判断', 100), detail: '原始说明（历史字段）', currentText: '更新后的产品判断。',
        eventIds: ['node-product-created', 'correction-product'], provenanceEventIds: ['node-product-created'],
        applicability: '2026Q2',
      }
      const driver = node('vp-driver', '供应链驱动', 48)
      const evidence = {
        id: 'ev-evidence', nodeType: 'evidence', kind: 'evidence', title: '隔离来源摘录', currentText: '仅供渲染测试的合成证据摘录。',
        detail: '', status: 'pending', createdSeq: 1, sourceKind: 'engine-reviewed', sourceRef: 'synthetic-source',
        sourceLabel: '隔离合成来源', sourceUrl: 'https://www.reuters.com/fixture/synthetic-source',
        sourcePublishedAt: '2026-09-18', sourceFetchedAt: '2026-09-21T09:55:00.000Z',
        eventIds: ['ev-evidence'], provenanceEventIds: ['ev-evidence'],
      }
      const support = { id: 'ev-support', eventId: 'ev-support', seq: 2, rel: 'supports', relationGroup: 'argument', from: evidence.id, to: product.id, pendingReview: false, reviewDecision: null }
      const association = { id: 'ev-association', eventId: 'ev-association', seq: 3, rel: 'influences', relationGroup: 'association', from: driver.id, to: product.id, pendingReview: false, reviewDecision: null }
      const revision = { id: 'ev-revision', eventId: 'ev-revision', seq: 5, rel: 'supersedes', relationGroup: 'revision', from: evidence.id, to: product.id, pendingReview: false, reviewDecision: null }
      const historyProjection = {
        nodes: [product, evidence], allNodes: [product, evidence], edges: [support], allEdges: [support], eventCount: 1,
        integrity: { ok: true, lastValidSeq: 1 },
      }
      const currentProjection = {
        nodes: [product, evidence, driver], allNodes: [product, evidence, driver], edges: [support, association, revision], allEdges: [support, association, revision], eventCount: 5,
        integrity: { ok: true, lastValidSeq: 5 },
      }
      const currentEvents = [
        { id: 'ev-evidence', seq: 1, at: '2026-09-20T12:00:00.000Z', type: 'evidence.appended', payload: {
          text: '仅供渲染测试的合成证据摘录。', sourceLabel: '隔离合成来源', sourceUrl: 'https://www.reuters.com/fixture/synthetic-source',
          sourcePublishedAt: '2026-09-18', sourceFetchedAt: '2026-09-21T09:55:00.000Z', ingestedAt: '2026-09-21T10:00:00.000Z',
          applicability: '2026Q2', scores: { matchScore: 0.84, attributionStrength: 0.62, effectiveStrength: 0.527 },
        } },
        { id: 'ev-support', seq: 2, at: '2026-09-21T12:00:00.000Z', type: 'relation.declared', payload: { rel: 'supports', from: { eventId: evidence.id }, to: { eventId: product.id } } },
        { id: 'ev-association', seq: 3, at: '2026-09-22T12:00:00.000Z', type: 'relation.declared', payload: { rel: 'influences', from: { eventId: driver.id }, to: { eventId: product.id } } },
        { id: 'correction-product', seq: 4, at: '2026-09-23T08:00:00.000Z', type: 'correction.appended', supersedes: 'node-product-created', payload: {
          oldValue: '原始说明（历史字段）', newValue: '更新后的产品判断。', text: '修订所依据的合成来源摘录。',
          sourceKind: 'engine-reviewed', sourceLabel: '隔离修订来源', sourceUrl: 'https://www.reuters.com/fixture/revision-source',
          sourcePublishedAt: '2026-09-18', sourceFetchedAt: '2026-09-22T09:00:00.000Z', ingestedAt: '2026-09-21T10:00:00.000Z',
          applicability: '2026Q2', scores: { matchScore: 0.82, attributionStrength: 0.6 },
        } },
        { id: 'ev-revision', seq: 5, at: '2026-09-23T08:01:00.000Z', type: 'relation.declared', payload: {
          rel: 'supersedes', from: { eventId: evidence.id }, to: { eventId: product.id },
        } },
      ]
      const historyEvents = currentEvents.slice(0, 1)
      const renderReader = (projection, events) => renderReaderView({ name: '隔离合成主题' }, {
        loadProjection: async () => projection, loadEvents: async () => events,
        loadProjectionAt: async (sequence) => sequence <= 1 ? historyProjection : currentProjection,
        onOpenBuilder: (kind, id) => { openedNode = `${kind}:${id}` },
      })
      const historicRoot = renderReader(historyProjection, historyEvents)
      const currentRoot = renderReader(currentProjection, currentEvents)
      historicRoot.setAttribute('data-snapshot', 'history')
      currentRoot.setAttribute('data-snapshot', 'current')
      document.querySelector('#fixture-root').append(historicRoot, currentRoot)
      await wait()
      check('读者视图以「一句话 + 原子看板」为主结构，不由支持数推导整体走向',
        Boolean(currentRoot.querySelector('.rdr-brief'))
        && Boolean(currentRoot.querySelector('.rdr-board'))
        && !currentRoot.querySelector('.rdr-pyramid')
        && !currentRoot.querySelector('.rdr-overall-direction'))
      check('一句话结论只用计数拼：出处之外的独立佐证让原子进入「被佐证」，没有数据的进入「没有外部数据」',
        (currentRoot.querySelector('.rdr-brief-verdict')?.textContent || '') === '2 个原子；1 个被出处之外的外部数据检验过；1 个还没有任何外部数据。'
        && (currentRoot.querySelector('.rdr-group.is-support')?.textContent || '').includes('产品判断')
        && (currentRoot.querySelector('.rdr-group.is-none')?.textContent || '').includes('供应链驱动'),
        currentRoot.querySelector('.rdr-brief-verdict')?.textContent || '(无)')
      const productRow = currentRoot.querySelector('.rdr-atom-row[data-atom-id="vp-product"]')
      productRow.click()
      await wait()
      const drawer = currentRoot.querySelector('.rdr-detail')
      check('点原子开抽屉：独立数据逐条带来源与原文链接，修订历史与原子关系都在',
        drawer.classList.contains('is-open')
        && drawer.textContent.includes('独立外部数据 · 1')
        && drawer.textContent.includes('隔离合成来源')
        && Boolean(drawer.querySelector('.rdr-ev-link[href="https://www.reuters.com/fixture/synthetic-source"]'))
        && drawer.textContent.includes('修订历史 · 1')
        && [...drawer.querySelectorAll('.rdr-atomd-rel-target')].some((button) => button.textContent === '供应链驱动'),
        drawer.textContent.slice(0, 200))
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }))
      await wait()
      check('Esc 关闭抽屉并把焦点还给触发的原子行', !drawer.classList.contains('is-open') && document.activeElement === productRow)
      /* 用户决定：读者页不要时间回放（播放 / 与当前对比 / 返回当前模型）。
         回放 UI 已从界面移除，这里改为断言"回放块不可见"；原来的 4 条行为断言
         （时间线对比 / 播放推进 / 暂停 / 返回当前状态）随功能一起下线——
         通过数会因此减少，这是覆盖范围变化，不是回归。
         注意：回放块内部 DOM 暂留（下一步连代码一起清），所以不断言元素不存在。 */
      check('读者页不再展示时间回放（播放 / 与当前对比 / 返回当前模型）',
        !currentRoot.querySelector('.rdr-replay-details'))

      /* 用户决定：理由清单与时间线都删除——它们与「按分类的观点清单 + 点开信息卡」功能重叠
         （信息卡已含 支持/反对/未表态 + 强度 + 相关原子 + 完整证据流），对应的 R1/R4 断言随之下线。 */

      /* 用户决定：读者页不再展示「还缺什么」面板（要求精简），对应的 R5 / P1-5 断言随之下线。
         缺口能力本身仍在（buildGapList 与收件箱待办通道未动），只是不再占读者页版面。 */

      document.querySelector('#fixture-report').textContent = `PASS (${results.length})\n${results.join('\n')}`
      document.body.dataset.fixture = 'pass'
    } catch (error) {
      results.push(`FAIL: ${error.stack || error}`)
      document.querySelector('#fixture-report').textContent = results.join('\n')
      document.body.dataset.fixture = 'fail'
      throw error
    }
  </script>
</body>
</html>
